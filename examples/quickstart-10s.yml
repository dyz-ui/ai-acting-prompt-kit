# =============================================================================
# 入门样板：10 秒、一个镜头、两个节拍
#
# 目的不是拍出好片，是让你在 3 分钟内看清「八维公式」到底填在哪。
# 跑法：
#   aiacting check examples\quickstart-10s.yml
#   aiacting build examples\quickstart-10s.yml -o prompt.txt
# =============================================================================

project:
  title: 深夜来电
  duration: 10
  genre: 家庭剧情
  style: 写实电影质感
  aspect: "16:9"
  resolution: 1080p
  camera: 35mm 观感，浅景深，固定机位，仅保留极轻微手持呼吸感
  era: 当代
  location: 深夜的出租屋厨房，只有灶台上方一盏暖黄小灯亮着
  lighting: 单光源侧逆光，脸一半在暗处，手机屏幕的冷光打在颧骨上
  sound: 原生同步对白
  ambience: 冰箱压缩机的低频嗡鸣，窗外偶尔一辆车经过
  guardrail:
    - 不出现字幕、水印、片头片尾
    - 不出现第二个人物
    - 人物面孔、发型、衣着在全片保持不变
    - 镜头全程固定，不推不拉不摇

characters:
  - id: man
    name: 男人
    age: 34 岁
    look: 短发有些塌，胡茬，眼窝深
    costume: 灰色旧 T 恤，肩线松垮
    voice: 中低音，平时说话偏轻

shots:
  - id: S1
    start: 0.0
    end: 10.0
    framing: 男人近景，四分之三侧脸，右肩后方是黑着的客厅
    camera_move: 固定
    focus: 男人
    note: 一镜到底，不切
    beats:
      # ---- 节拍 1：还没听懂 ----
      - start: 0.0
        end: 4.5
        who: 男人
        objective: 确认自己有没有听错
        emotion_curve: 困倦 → 不确定 → 追问
        trigger_line: "你说什么？"
        line: "……你说什么？"
        face_natural: 原本半垂的眼睑先抬起来一点，眉毛外侧上抬；说到"什么"时眉心轻微收拢，嘴唇张开但没马上合上
        face_au: [AU2:2, AU5:2, AU4:1]
        gaze_body: 视线从灶台移向虚空，手机贴在右耳，左手垂着，指尖碰着台面边缘
        voice: 音量比正常说话低，语速慢，"什么"两个字之间隔了半拍
        pause: 说完后停 1.2 秒，只有冰箱的嗡鸣
        end_state: 嘴还张着，眼睛盯着前方一个点
        forbidden: [不要皱眉到底, 不要坐下, 不要看镜头, 不要提前红眼眶]

      # ---- 节拍 2：听懂了，但压住 ----
      - start: 4.5
        end: 10.0
        who: 男人
        objective: 不让对方听出自己已经崩了
        emotion_curve: 强撑 → 喉咙失控 → 硬压回去
        trigger_line: "我知道了。"
        line: "……我知道了。"
        face_natural: 下巴先绷紧并抬起，双唇向内压紧；说"知道"时喉部吞咽一次，眼眶迅速蓄水但不下落；说完后眼睛短暂闭合半秒又睁开
        face_au: [AU17:3, AU24:3, AU1:3, AU43:2]
        gaze_body: 视线掉到台面上，左手撑住台面边缘，指节发白；肩膀没有起伏
        voice: 音量降到几乎听不清，两个词之间断开；"了"字尾音发虚，没有说完就收住
        pause: 说完后留 1.5 秒完全静止，只有一次鼻息
        end_state: 眼睛睁着，眼泪停在眼眶里没有落下，嘴唇仍压着
        forbidden: [不要哭出声, 不要蹲下, 不要挂电话, 不要让眼泪落下, 不要摇头]
